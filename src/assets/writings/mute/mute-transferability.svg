<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc">
<title id="title">MUTE black-box transferability</title>
<desc id="desc">Sync scores on four unseen talking-head models. Lower is better. MUTE outperforms the strongest baseline on every target in Table 3.</desc>
<rect width="1000" height="590" fill="#ffffff"/>
<g font-family="Arial, sans-serif" fill="#262626">
<text x="40" y="45" font-size="26" font-weight="600">Transfer to unseen talking-head models</text>
<text x="40" y="76" font-size="17" fill="#555555">Sync score (lower is better) · Public paper, Table 3</text>
<rect x="40" y="100" width="18" height="18" rx="3" fill="#43617d"/><text x="68" y="115" font-size="17">MUTE</text>
<rect x="190" y="100" width="18" height="18" rx="3" fill="#b8c1ca"/><text x="218" y="115" font-size="17">Best baseline for each target</text>
<text x="40" y="183" font-size="20" font-weight="600">Hallo2</text>
<rect x="215" y="155" width="156.5" height="28" rx="3" fill="#43617d"/>
<text x="381.5" y="176" font-size="18">1.397</text>
<rect x="215" y="190" width="255.4" height="28" rx="3" fill="#b8c1ca"/>
<text x="480.4" y="211" font-size="18">2.280 (CAF)</text>
<text x="40" y="279" font-size="20" font-weight="600">Audio2Head</text>
<rect x="215" y="251" width="406.2" height="28" rx="3" fill="#43617d"/>
<text x="631.2" y="272" font-size="18">3.627</text>
<rect x="215" y="286" width="448.6" height="28" rx="3" fill="#b8c1ca"/>
<text x="673.6" y="307" font-size="18">4.005 (CAF)</text>
<text x="40" y="375" font-size="20" font-weight="600">SadTalker</text>
<rect x="215" y="347" width="526.7" height="28" rx="3" fill="#43617d"/>
<text x="751.7" y="368" font-size="18">4.703</text>
<rect x="215" y="382" width="593.3" height="28" rx="3" fill="#b8c1ca"/>
<text x="818.3" y="403" font-size="18">5.297 (ARO)</text>
<text x="40" y="471" font-size="20" font-weight="600">Ditto</text>
<rect x="215" y="443" width="387.2" height="28" rx="3" fill="#43617d"/>
<text x="612.2" y="464" font-size="18">3.457</text>
<rect x="215" y="478" width="425.9" height="28" rx="3" fill="#b8c1ca"/>
<text x="650.9" y="499" font-size="18">3.803 (ARO)</text>
<text x="40" y="566" font-size="15" fill="#666666">Perturbations are generated on Hallo only. Values are means over three seeds.</text>
</g></svg>
